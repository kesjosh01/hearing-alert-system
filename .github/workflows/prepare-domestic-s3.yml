name: Prepare domestic S3 model
on:
  push:
    branches: [codex/domestic-overfit-s3]
    paths: ['ml/models/domestic_overfit_20261119/esp32s3/export_model.py', '.github/workflows/prepare-domestic-s3.yml']
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install tensorflow==2.21.0 tf-keras==2.21.0 scipy ai-edge-litert
      - name: Retrieve only the listed training-split recordings
        run: |
          python - <<'PY'
          import json, pathlib, urllib.request
          p = pathlib.Path('ml/models/domestic_overfit_20261119/esp32s3/recordings.json')
          manifest = json.loads(p.read_text())
          dest = pathlib.Path('calibration_audio')
          dest.mkdir()
          for name in manifest['calibration'] + manifest['conversion_check']:
              url = 'https://raw.githubusercontent.com/karolpiczak/ESC-50/' + manifest['revision'] + '/audio/' + name
              urllib.request.urlretrieve(url, dest / name)
          PY
      - name: Convert and verify
        env:
          TF_NUM_INTRAOP_THREADS: 2
          TF_NUM_INTEROP_THREADS: 2
          OPENBLAS_NUM_THREADS: 1
        run: |
          python ml/models/domestic_overfit_20261119/esp32s3/export_model.py calibration_audio "$RUNNER_TEMP/model"
          cp "$RUNNER_TEMP/model/"{model_int8.tflite,conversion_report.json} ml/models/domestic_overfit_20261119/esp32s3/
      - name: Save the converted checkpoint to the experiment branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ml/models/domestic_overfit_20261119/esp32s3/model_int8.tflite ml/models/domestic_overfit_20261119/esp32s3/conversion_report.json
          git diff --cached --quiet || git commit -m "Include verified domestic overfit int8 model for S3"
          git push origin HEAD:codex/domestic-overfit-s3
